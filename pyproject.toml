# Dev-only project metadata so `uv run --locked python -m pytest` finds the test
# runner. The shipped scripts stay stdlib-only (Python 3.9+) and are not packaged
# from here; the 3.11 floor below is only for the pytest 9 dev environment.
[project]
name = "token-optimizer-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.6",
]

[tool.uv]
package = false
